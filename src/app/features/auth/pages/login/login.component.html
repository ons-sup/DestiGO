<main class="auth">
  <section class="auth__card" aria-labelledby="login-title">
    <h1 id="login-title" class="auth__title">Welcome back</h1>
    <p class="auth__subtitle">Log in to keep your destinations close.</p>

    @if (errorMessage(); as message) {
      <p class="auth__alert" role="alert">{{ message }}</p>
    }

    <form class="auth__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="auth__field">
        <label class="auth__label" for="login-email">Email</label>
        <input
          class="auth__input"
          id="login-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="emailInvalid ? true : null"
        />
      </div>
      <div class="auth__field">
        <label class="auth__label" for="login-password">Password</label>
        <input
          class="auth__input"
          id="login-password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </div>
      <button class="auth__submit" type="submit">Log in</button>
    </form>

    <p class="auth__switch">New to DestiGO? <a routerLink="/auth/register">Create an account</a></p>
  </section>
</main>
