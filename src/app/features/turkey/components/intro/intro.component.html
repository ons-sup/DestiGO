<section class="intro">
  <div class="intro__wrapper">
<div class="intro__text">
      <h2 class="intro__heading reveal-item" style="--item-delay:40ms">A land of timeless wonders</h2>
      <p class="intro__body reveal-item" style="--item-delay:120ms">{{ introduction() }}</p>
    </div>
    <figure class="intro__figure reveal-media reveal-item" style="--item-delay:160ms">
      <img
        class="intro__image"
        [src]="image()"
        alt="Historic architecture and landscapes across Türkiye"
        loading="lazy"
        width="1200"
        height="800"
      />
    </figure>
  </div>
</section>
