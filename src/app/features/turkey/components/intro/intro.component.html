<section class="intro">
  <div class="intro__wrapper">
    <div class="intro__text">
      <h2 class="intro__heading">About Türkiye</h2>
      <p class="intro__body">{{ introduction() }}</p>
    </div>
    <figure class="intro__figure">
      <img
        class="intro__image"
        [src]="image()"
        alt="Türkiye landscape"
        loading="lazy"
      />
    </figure>
  </div>
</section>
