<header class="hero">
  <img class="hero__bg" [src]="countryImage()" alt="Hot air balloons over Cappadocia at dawn" loading="eager" fetchpriority="high" width="4000" height="2667" />
  <div class="hero__content">
    <span class="hero__kicker">Türkiye</span>
    <h1 class="hero__title">{{ countryName() }}</h1>
    <p class="hero__tagline">{{ countryTagline() }}</p>
    <a class="hero__cta" href="#destinations">Explore destinations</a>
  </div>
</header>
