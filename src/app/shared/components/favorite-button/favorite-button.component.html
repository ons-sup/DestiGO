<button
  type="button"
  class="favorite-btn"
  [class.filled]="favoritesService.isFavorite(destinationId())"
  [class]="'size-' + size()"
  (click)="onClick($event)"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-pressed]="favoritesService.isFavorite(destinationId())"
  title="{{ favoritesService.isFavorite(destinationId()) ? 'Remove from favorites' : 'Add to favorites' }}"
>
  <svg
    class="heart-icon"
    viewBox="0 0 24 24"
    fill="currentColor"
    aria-hidden="true"
    [attr.fill]="favoritesService.isFavorite(destinationId()) ? 'currentColor' : 'none'"
    [attr.stroke]="favoritesService.isFavorite(destinationId()) ? 'none' : 'currentColor'"
  >
    <path
      d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</button>
