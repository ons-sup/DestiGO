<app-hero-section
  [titleLines]="['Discover', 'Italy']"
  [titleFlag]="'assets/images/world-flag.png'"
  subtitle="Explore the most beautiful places. Live the culture, taste the best food and create unforgettable memories."
  [videoSrc]="getHeroVideo()"
  ctaText="Explore Destinations"
  ctaRoute="/destinations"
  [showCta]="true"
/>

<section class="popular-destinations">
  <div class="section-header">
    <div>
      <h2>Popular Destinations</h2>
      <p>Hand-picked places you can't miss.</p>
    </div>
    <a routerLink="/destinations" class="view-all">View All →</a>
  </div>
  <div class="destination-cards">
    @for (destination of popularDestinations; track destination.id) {
      <app-destination-card [destination]="destination" variant="small" />
    }
  </div>
</section>
