<app-hero-section
  [eyebrow]="'DISCOVER ITALY'"
  [title]="'Discover '"
  [titleAccent]="'Italy'"
  [subtitle]="'Explore the most beautiful places. Live the culture, taste the best food and create unforgettable memories.'"
  [videoSrc]="getHeroVideo()"
  [ctaText]="'Explore Destinations'"
  [ctaRoute]="'/italy/destinations'"
  [showCta]="true"
/>

<section class="popular-destinations" appRevealOnScroll>
  <div class="section-header">
    <div>
      <h2 class="reveal-item" style="--item-delay:40ms">Popular Destinations</h2>
      <p class="reveal-item" style="--item-delay:120ms">Hand-picked places you can't miss.</p>
    </div>
    <a routerLink="/italy/destinations" class="view-all">View All ï¿½ï¿½'</a>
  </div>
  <div class="destination-cards">
    @for (destination of popularDestinations; track destination.id; let i = $index) {
      <app-destination-card [destination]="destination" variant="small" appRevealOnScroll [revealDelay]="i * 90" />
    }
  </div>
</section>
